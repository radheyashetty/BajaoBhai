<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <meta name="theme-color" content="#05070a">
    <meta name="description" content="Real-time party music app where users vote songs together">

    <title id="page-title">Bajao Bhai</title>
    <link rel="icon" href="data/bajaobhaicreators.jpeg" type="image/jpeg">

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- PWA -->
    <link rel="manifest" href="manifest.json">

    <style>
        .active-scale:active {
            transform: scale(0.9);
        }

        .search-results-panel {
            backdrop-filter: blur(20px);
        }

        #progress-bar {
            will-change: width;
        }

        .chat-msg { position: relative; padding-right: 20px; }
        .chat-msg .chat-delete-btn {
            display: none;
            position: absolute;
            right: 0;
            top: 0;
            background: none;
            border: none;
            color: #dc3545;
            cursor: pointer;
            font-size: 0.7rem;
            padding: 0 2px;
            opacity: 0.7;
        }
        .chat-msg:hover .chat-delete-btn { display: inline-block; }
        .chat-msg .chat-delete-btn:hover { opacity: 1; }
        .chat-mention { background: rgba(99,102,241,0.3); border-radius: 3px; padding: 0 2px; color: #a5b4fc; }
        #chat-typing { height: 18px; font-size: 0.75rem; color: #adb5bd; font-style: italic; }
    </style>
</head>

<body class="dashboard-body">

<!-- NAVBAR -->
<nav class="glass-nav d-flex justify-content-between align-items-center px-4 py-3 sticky-top z-3">
    <div class="d-flex align-items-center gap-3 party-brand-wrap">
        <img src="data/bajaobhaicreators.jpeg" alt="Bajao Bhai logo" class="project-logo project-logo-sm">
        <div class="brand-copy-wrap">
            <div class="fw-bold fs-4 brand-title text-nowrap">BAJAO BHAI</div>
            <div class="text-muted party-nav-subtitle d-none d-sm-block">Real-time queue, voting, and playback</div>
        </div>
    </div>

    <div class="d-flex align-items-center gap-3">
        <span id="connection-status" class="badge bg-secondary">Connecting...</span>



        <button id="relinquish-host-btn" class="btn btn-outline-light btn-sm d-none">
            Unhost
        </button>

        <button id="toggle-sidebar-btn" class="btn btn-link text-white d-lg-none">
            <i class="fa-solid fa-users"></i>
        </button>

        <div class="glass-panel px-3 py-1 rounded-pill">
            <span id="nav-party-code"></span>
        </div>

        <div class="avatar" id="user-avatar">?</div>
    </div>
</nav>

<!-- MAIN -->
<main class="container-fluid px-4 py-4 main-content">

<div class="row g-4">

<!-- LEFT -->
<div class="col-lg-8">

<!-- SEARCH -->
<div class="position-relative mb-4 search-shell">
    <div class="glass-panel d-flex align-items-center gap-2 p-2">
        <i class="fa fa-search text-muted"></i>
        <input id="search-input" class="form-control bg-transparent text-white border-0"
            placeholder="Search songs..." autocomplete="off">
    </div>

    <div id="search-results" class="glass-panel position-absolute w-100 d-none search-results-panel"
        style="max-height:300px; overflow-y:auto;"></div>
</div>

<!-- QUEUE -->
<div class="queue-section">
    <div class="d-flex justify-content-between align-items-center mb-2">
        <div>
            <h5 class="mb-0">Up Next</h5>
            <div class="queue-subtitle text-muted small">Songs the room voted in</div>
        </div>
        <div class="d-flex flex-column align-items-end gap-1">
            <span id="queue-count" class="queue-count-pill">0</span>
            <span id="skip-vote-ratio" class="text-warning small d-none">Skip votes: 0/0</span>
        </div>
    </div>

    <div id="queue-loading" class="text-muted">Loading...</div>
    <div id="queue-list" class="queue-list-wrap"></div>
</div>

</div>

<!-- RIGHT -->
<div id="users-sidebar" class="col-lg-4 d-none d-lg-block">
    <div class="d-flex justify-content-between align-items-center d-lg-none mb-2">
        <span class="fw-bold">Room Members & Chat</span>
        <button class="btn btn-sm btn-outline-light" onclick="toggleSidebar()"><i class="fa fa-times"></i></button>
    </div>
    <div class="glass-panel p-3 mb-3">
        <h6>Users</h6>
        <div id="users-list"></div>
    </div>
    
    <div class="glass-panel p-3 d-flex flex-column mb-3" style="height: 380px;">
        <h6>Party Chat</h6>
        <div id="chat-messages" class="flex-grow-1 overflow-auto mb-2 small pe-1 mt-2" style="scrollbar-width: thin;">
            <div class="text-muted fst-italic text-center mt-3">Welcome to the party chat!</div>
        </div>
        <div id="chat-typing"></div>
        <form id="chat-form" class="d-flex gap-2 mt-auto">
            <input id="chat-input" class="form-control form-control-sm bg-transparent text-white border-secondary" placeholder="Send a message..." autocomplete="off" maxlength="500">
            <button type="submit" class="btn btn-sm btn-primary active-scale">
                <i class="fa fa-paper-plane"></i>
            </button>
        </form>
    </div>
</div>

</div>
</main>

<!-- PLAYER -->
<div class="player-bar fixed-bottom glass-panel p-2">

<div id="progress-track" style="height:4px; cursor:pointer;">
    <div id="progress-bar" style="width:0%; height:100%; background:cyan;"></div>
</div>

<div class="d-flex justify-content-between align-items-center">

<div class="d-flex align-items-center gap-2 overflow-hidden" style="max-width: 40%;">
    <img id="now-playing-thumb" width="40" height="40" alt="" loading="lazy" class="rounded flex-shrink-0" onerror="this.style.display='none'">
    <span id="now-playing-title" class="text-truncate small fw-medium">No song</span>
</div>

<div>
    <button id="play-btn" class="btn active-scale">
        <i id="play-icon" class="fa fa-play"></i>
    </button>

    <button id="mute-btn" class="btn active-scale">
        <i id="mute-icon" class="fa fa-volume-high"></i>
    </button>

    <span class="volume-wrap ms-2">
        <input id="volume-slider" type="range" min="0" max="100" value="80" aria-label="Playback volume">
    </span>


    <button id="host-skip-btn" class="btn btn-outline-danger btn-sm ms-2 d-none">Skip</button>
</div>

<div id="time-display">0:00</div>

</div>
</div>


<!-- TOAST -->
<div style="position:fixed; bottom:20px; right:20px;">
    <div id="toast" style="opacity:0; transition:0.3s;" class="glass-panel p-2">
        <span id="toast-msg"></span>
    </div>
</div>

<!-- SCRIPTS -->
<script src="/socket.io/socket.io.js"></script>
<script src="https://www.youtube.com/iframe_api"></script>
<script src="app.js?v=2" type="module"></script>

</body>
</html>
